<!-- ── HIT-BOX REPAIR FOR THE BLOCK GRID ────────────────────────────────────────
     He reported this twice: "the hit box for the grass and dirt and others is
     not accurate." Repaired here by RULE, appended after the bundle and outside
     the React root, for the same reason as the touch-floor block in <head>:
     this artifact can be regenerated from its source, and a rule that matches by
     class survives regeneration where an edit inside the minified tree does not.
     Nothing added here is position:fixed — a floating control over a full-width
     grid covers blocks and eats taps, which is the bug being fixed. -->
<style>
/* 1. THE GUTTER — this is the defect. `gap-[3px]` put 3px of board colour
      between every pair of blocks. That band belongs to no cell, and the only
      click handler anywhere in the board subtree is on the cells, so ~17% of the
      play surface had nothing underneath it. A tap landing there either did
      nothing at all (WebKit, i.e. every browser on an iPhone) or was snapped by
      the engine's touch-adjustment onto a NEIGHBOURING cell — and that cell's
      handler is a toggle, so it DELETED a block he had already placed. The seam
      is now drawn inside each cell instead of between them: it reads the same,
      and every pixel of it now belongs to somebody. The 4px corner radius goes
      with it — a rounded box is hit-tested rounded, so every one of the 81
      four-way junctions still carried a ~2.5px dead diamond after the gap was
      closed. Square blocks, and the seam draws the grid. */
.grid-cols-10.grid-rows-10{gap:0 !important}
.grid-cols-10.grid-rows-10>div{border-radius:0 !important}
.grid-cols-10.grid-rows-10>div::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1.5px #B9D8FF}

/* 2. THE FRAME. The inner margin moves off the frame and onto the grid itself.
      WebKit resolves the grid's `h-full` against the frame's BORDER box, so
      while the frame carries a border and padding the grid is exactly
      border+padding too tall and `overflow-hidden` clips the bottom row — a row
      of blocks drawn on screen with its lower third not tappable, on the engine
      every iPhone and iPad runs. With the frame at zero the two boxes coincide
      and the clip disappears. The 2px frame line is repainted as a shadow,
      which costs no layout. */
.bg-\[\#B9D8FF\]{padding:0 !important;border-width:0 !important;box-shadow:inset 0 0 0 2px rgba(15,76,129,.15)}
.grid-cols-10.grid-rows-10{padding:8px}

/* 3. THE BOARD IS SMALLER THAN HIS FINGER. 28.1px cells on a 390px phone against
      this project's own 44px floor — a floor that never reached them because the
      cells are <div>, not <button>, so `button,a[role=button],.btn` does not
      match. Ten 44px cells need a 549px viewport, which no phone has, so the
      board is given the page's side padding back instead. Sized in rem so the
      mobile gate's 22px-root re-measure cancels exactly, as -1rem always
      cancels `px-4`, and never overshoots into a horizontal overflow. */
@media (max-width:767px){
  .md\:p-5{margin-left:-1rem;margin-right:-1rem;padding:8px !important}
  .grid-cols-10.grid-rows-10{padding:3px}
}
/* Tablet portrait is the worst case of the lot, not the best: at >=768px the
   300px palette column takes the width, and `md:aspect-[1.1]` then squashes what
   is left into non-square cells under square-looking art. */
@media (min-width:768px) and (max-width:1023px){
  .md\:p-5{padding:10px !important}
  .bg-\[\#B9D8FF\]{aspect-ratio:1 !important}
  .grid-cols-10.grid-rows-10{padding:4px}
}

/* 4. A TRANSFORM MOVES THE HIT BOX, NOT JUST THE PAINT. `pop` scaled a
      just-placed cell to 1.25 for ~180ms, and a transformed cell paints — and so
      hit-tests — above its earlier siblings, so the next tap up or to the left
      landed on the block he had just placed and toggled it off.
      `active:scale-[0.92]` retracts the live box ~1.1px per edge while the
      finger is down, so a press near an edge is standing outside its own target
      by the time it is released and the click is thrown away. Both flourishes
      are kept — as light, which cannot move a hit box, instead of as movement. */
.grid-cols-10.grid-rows-10>div[style*="animation"]{animation-name:ulab-pop !important}
@keyframes ulab-pop{0%{filter:brightness(1.85);opacity:.45}55%{filter:brightness(1.12);opacity:1}100%{filter:brightness(1);opacity:1}}
.grid-cols-10.grid-rows-10>div:active{transform:none !important;filter:brightness(1.22)}

/* 5. `touch-action` appears nowhere in the file, so iOS keeps double-tap-to-zoom
      armed over a hundred targets whose entire purpose is being tapped fast.
      `manipulation` keeps scrolling and pinch and drops only the double-tap. */
.grid-cols-10.grid-rows-10,.grid-cols-10.grid-rows-10>div{touch-action:manipulation}
</style>

    if(song.clap.indexOf(slot)>=0) hit(t,'bandpass',1600,0.25,0.09);
    if(song.hat&&slot%2===0) hit(t,'highpass',7000,song.hat,0.035);
    if(song.bass.indexOf(slot)>=0) tone(t,hz(ch[0]),song.bassType,master,song.bassPeak,song.bassDur);
    if(song.stab.indexOf(slot)>=0) for(i=1;i<4;i++) tone(t,hz(ch[i]),'triangle',master,0.09,0.26);
    if(slot%2===0){ var n=song.mel[bar2][slot/2]; if(n!=='.') tone(t,hz(n),song.leadType,lead,song.leadPeak,song.leadDur); }
  }
  /* Lookahead scheduler, not one timer per note: setInterval drifts tens of ms
     against a 156ms sixteenth and is clamped to ~1s in a hidden tab. The timer
     decides only WHEN TO SCHEDULE; every note carries an exact currentTime, so
     the drift never reaches the ear. */
  function tick(){
    if(next<ctx.currentTime) next=ctx.currentTime+0.06;       /* resync after a suspend */
    while(next<ctx.currentTime+LOOK){
      schedule(step,next); next+=S16; step++;
      /* the 8 bars are done — rotate to the next tune, its own tempo and all */
      if(step>=song.prog.length*song.spb){ step=0; setSong(si+1); }
    }
  }

  var btn=document.getElementById('umusica'), btnSong=document.getElementById('umsong');
  if(!btn||!btnSong) return;
  function paint(){ btn.setAttribute('aria-pressed',on?'true':'false'); btn.textContent=on?'♪ MUSIC ON':'♪ MUSIC'; }
  function ramp(to,secs){
    var g=master.gain, now=ctx.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(Math.max(g.value,0.0001),now);
    g.exponentialRampToValueAtTime(to,now+secs);
  }
  function start(){
    if(on) return; on=true;
    if(!ctx) build();
    ctx.resume(); ramp(LEVEL,0.4);
    next=ctx.currentTime+0.08; step=0;
    if(!timer) timer=setInterval(tick,TICK);
    tick(); paint();
  }
  function stop(){
    if(!on) return; on=false;
    if(timer){ clearInterval(timer); timer=null; }
    if(ctx){ ramp(0.0001,0.25); setTimeout(function(){ if(!on&&ctx) ctx.suspend(); },400); }
    paint();
  }
  function note(){
    if(ls(NOTEKEY)) return; ls(NOTEKEY,'1');
    var n=document.createElement('p'); n.id='umnota';
    n.textContent='These are the lab’s own songs — three tunes written into the page just for you. I can’t put Bad Bunny or “Sugar, Sugar” in here: those records belong to the people who made them.';
    bar.appendChild(n);
    setTimeout(function(){ n.style.opacity='0'; },12000);
    setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); },12800);
  }

  btn.addEventListener('click',function(){
    btn.classList.remove('umnew');
    if(on){ ls(KEY,'off'); stop(); } else { ls(KEY,'on'); start(); note(); }
  });
  /* The song's name is itself the "next song" button. While the music is off a
     tap starts it on the next tune — a music button that stays silent when
     tapped reads as broken, and the tap is the user gesture autoplay needs. */
  btnSong.addEventListener('click',function(){
    btn.classList.remove('umnew');
    setSong(si+1); step=0;
    if(on){ next=ctx.currentTime+0.08; tick(); }
    else { ls(KEY,'on'); start(); note(); }
  });
  setSong(parseInt(ls(SONGKEY),10)||0);   /* the remembered tune; also paints the name */
  paint();

  /* Never makes a sound on its own. Only for someone who already turned it on,
     and not until they touch the page — a stored preference cannot legally start
     audio on load, so "remember that I said yes" IS "start at the first touch". */
  if(ls(KEY)==='on'){
    var arm=function(ev){
      /* Not from a press on either music button: until the first gesture the
         bar still reads off, so arming there would start the song only for
         the click behind it to immediately stop or skip it. */
      if(ev.target&&ev.target.closest&&ev.target.closest('#umusica,#umsong')) return;
      document.removeEventListener('pointerdown',arm,true);
      document.removeEventListener('keydown',arm,true);
      start();
    };
    document.addEventListener('pointerdown',arm,{capture:true,passive:true});
    document.addEventListener('keydown',arm,true);
  } else if(ls(KEY)===null){ btn.classList.add('umnew'); }

  /* A hidden tab clamps timers to ~1s, which starves a 0.12s lookahead into a
     stutter. Nobody needs the song while they are somewhere else. */
  document.addEventListener('visibilitychange',function(){
    if(!ctx) return;
    if(document.hidden){ if(timer){ clearInterval(timer); timer=null; } ctx.suspend(); }
    else if(on){ ctx.resume(); next=ctx.currentTime+0.08; if(!timer) timer=setInterval(tick,TICK); }
  });
})();
</script>
