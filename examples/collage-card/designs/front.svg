<!-- COLLAGE-001, front. Authored at BLEED and cropped to trim, never the other way
     round: docs/INTEGRATING.md says trim is DERIVED by cropping 22 px per edge,
     because 87.5x55.88 converted independently gives 2066x1320 and an odd 45-px
     difference cannot centre a 1275-px trim box.

     THE PALETTE IS NOT A CHOICE MADE HERE. Every colour is read out of the
     product's own DEPLOYED stylesheet, collage/assets/index-59fbad44.css, whose
     :root declares color-scheme:dark and defines the custom properties void
     (#030405) and surface-0 through surface-4, plus the #7C3AED its index.html
     carries inline. (Those property names are written out in words rather than
     quoted with their leading double hyphens, because XML forbids a double hyphen
     inside a comment — quoting them verbatim is a parse error that stops this face
     rendering at all. The AV card documents this trap and it still caught this
     file on its first render.) Read from the live artifact rather
     than from the repo's collage/ directory ON PURPOSE: the deployed page loads
     index-59fbad44.css while the repo tree at HEAD carries index-7caf51d4.css, so
     the two are not the same bytes and only one of them is the thing a holder
     opens. Same rule the AV card followed against av/trade.js.

     THE NAME IS THE MAINTAINER'S, NOT THE BUILD'S. The card says Collage Studio
     because collage/credits.json — a file they serve publicly — opens "Collage
     Studio — Wall of Wishes", and the source lives at tools/collage-studio/. The
     bundle's <title> and PWA manifest both say "Smart Crop GenArt Studio" and the
     string "Collage Studio" appears zero times in the shipped JS, so the two
     names are both real and the maintainer's own voice wins the ink. A card is
     permanent; a build title is not.

     THE MARK IS AN OUTPUT, NOT A LOGO, and it sits in exactly the rectangle the
     QR occupies on the back — turn the card over and the partition becomes the
     code. Cells are drawn by tools/gen_mark.py from the seed printed beneath
     them, using the same mulberry32 the deployed bundle ships, so a holder can
     reproduce these cells rather than take them on trust. Inventing a logo for a
     product whose entire mechanic is "re-roll the composition from a seed" would
     have been a second identity for a thing that already has one.

     NOTHING COUNTABLE IS PRINTED. The wall of wishes grows; the tool grows. Ink
     is as permanent as the chip, so a number set in it starts decaying the day it
     dries. Only what survives growth goes on the card. -->
<svg xmlns="http://www.w3.org/2000/svg" width="87.5mm" height="55.88mm" viewBox="-0.95 -0.95 87.5 55.88">
  <rect x="-0.95" y="-0.95" width="87.5" height="55.88" fill="#030405"/>

  <!-- Accent rule at the bleed edge: it runs OFF the card on purpose, while every
       glyph stays >= 4 mm inside trim. The GT archive faces ran ink to 0.00 mm on
       six of eight edges and a 2 mm frame ate the footer; type never goes near the
       edge again. -->
  <rect x="-0.95" y="-0.95" width="2.6" height="55.88" fill="#7C3AED"/>

  <text x="8" y="17.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" fill="#EEF1F0" letter-spacing="0.15">Collage</text>
  <text x="8" y="26.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.4" font-weight="700" fill="#7C3AED" letter-spacing="0.1">Studio</text>

  <line x1="8" y1="30.6" x2="44" y2="30.6" stroke="#1F2427" stroke-width="0.35"/>

  <text x="8" y="35.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="2.5" fill="#A9B0B0">Cut a picture into cells, crop</text>
  <text x="8" y="39.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="2.5" fill="#A9B0B0">each one, re-roll from a seed.</text>

  <text x="8" y="49.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="2.2" font-weight="700" fill="#7C3AED" letter-spacing="0.35">VORONOI · PACKINGS · SUBDIVISIONS</text>

