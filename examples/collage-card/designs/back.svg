<!-- COLLAGE-001, back — the face that has to work as a machine.

     THE URL IS PRINTED IN FULL AND UNSHORTENED, wrapped at its own slashes, and
     it takes three lines here where the AV card needed two. It is long, a
     shortener would look better, and that is the trade being refused: the only
     redirector this network has, persona500.com/c/<slug>, answers 200 for slugs
     it has never heard of by falling through to a different project's site. A
     card carrying an unmapped slug therefore looks perfectly healthy to every
     check that reads a status code, and lands its holder on the wrong page. Ink
     and chip both outlive the table behind a redirect. What is printed here
     resolves without a lookup, which is the only property that survives.

     THE CODE IS GEOMETRY, NOT AN IMAGE: librsvg silently declines to load an
     href above the SVG's own directory, so the founder card's ../assets/qr.png
     renders as an empty white patch under this rasteriser and the card still
     looks finished. Rects cannot fail to load and cannot be resampled grey.

     24 mm of code on a 30 mm patch — both larger than the AV card's 22 on 28,
     and not for looks. This URL is 66 bytes against that one's 61, which pushes
     the symbol from 33 modules to 37 (QR version 5, EC M). Holding 22 mm would
     have shrunk each module to 0.595 mm; 24 mm keeps them at 0.649 mm against a
     0.4 mm print floor. The white patch grew with it: 3.0 mm of quiet on every
     side where four modules of this symbol need 2.595. A bigger payload buys a
     bigger code, not a tighter one. Every number here is qr_to_svg.py's own
     report for this splice, not arithmetic done in this comment.

     THE LIGHT HERE IS THE PRODUCT'S OWN. #EEF1F0 and the greys below are read
     out of the deployed stylesheet's palette, the same file the front reads. A
     dark back would have printed the same identity twice, flooded an inkjet with
     ink where a QR needs the cleanest white on the card, and cost the scan. -->
