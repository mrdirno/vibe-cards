<!-- AV-TOOLKIT-001, back — the face that has to work as a machine.

     THE URL IS PRINTED IN FULL AND UNSHORTENED, wrapped at its own slash. It is
     long, a shortener would look better, and that is the trade being refused: the
     only redirector this network has, persona500.com/c/<slug>, answers 200 for
     slugs it has never heard of by falling through to a different project's site.
     A card carrying an unmapped slug therefore looks perfectly healthy to every
     check that reads a status code, and lands its holder on the wrong page. Ink
     and chip both outlive the table behind a redirect. What is printed here
     resolves without a lookup, which is the only property that survives.

     THE CODE IS GEOMETRY, NOT AN IMAGE, and the reason is in tools/qr_to_svg.py:
     librsvg silently declines to load an href above the SVG's own directory, so
     the founder card's `../assets/qr.png` renders as an empty white patch under
     this rasteriser and the card looks finished. Rects cannot fail to load and
     cannot be resampled grey.

     22 mm of code on a 28 mm patch. 33 modules at 0.667 mm each, against a 0.4 mm
     print floor, and 3.0 mm of white on every side where four modules need 2.67.
     Bigger than the founder card's 0.512 mm per module, because this URL is 61
     bytes where that one is 36, and because this card gets scanned in a truck at
     arm's length rather than on a desk. -->
