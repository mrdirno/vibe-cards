<!-- KUNAI-001, front. Authored at BLEED and cropped to trim, never the other way
     round — same derivation the collage card documents: 87.5x55.88 rasterised at
     2066x1319, trim cropped 22 px per edge.

     THE PALETTE IS NOT A CHOICE MADE HERE. Every colour is read out of the
     product's own DEPLOYED page, https://mrdirno.github.io/kunai-360/, whose
     inline stylesheet declares the custom properties bg (#0d0f10), ink (#eceae6),
     steel (#8fa3b0), edge (#c9d4da), dim (rgba 236,234,230,.6), faint (rgba
     236,234,230,.36) and rule (rgba 143,163,176,.22), plus the #e0a184 the page
     carries as its warm accent. (Property names are written in words, not quoted
     with their leading hyphens: XML forbids a double hyphen inside a comment, a
     trap the AV and collage cards both document.) The type is Menlo because the
     deployed page's own mono stack ends ui-monospace, Menlo — the first name in
     that stack that is actually installed where this card is rasterised.

     THE NAME IS THE MAINTAINER'S. The deployed page's title element says
     KUNAI-360, its meta description says "A printable Insta360 ONE X housing,
     generated from code. Tap the card, it opens here." The page expects this
     card; the card uses the page's words.

     THE MARK IS AN OUTPUT, NOT A LOGO, and it sits in exactly the rectangle the
     QR occupies on the back — turn the card over and the housing becomes the
     code. It is the housing's own top view drawn by tools/gen_mark.py from the
     constants in the product's generator, kunai_360_onex_v4.py, whose whole
     point is that every hole is a named number. The generator filename is
     printed beneath the mark so a holder can find those numbers.

     NOTHING COUNTABLE IS PRINTED. The generator's check count and changelog
     grow; ink is as permanent as the chip. Two halves is the design, not a
     count. -->
<svg xmlns="http://www.w3.org/2000/svg" width="87.5mm" height="55.88mm" viewBox="-0.95 -0.95 87.5 55.88">
  <rect x="-0.95" y="-0.95" width="87.5" height="55.88" fill="#0d0f10"/>

  <!-- Accent rule at the bleed edge: runs off the card on purpose, while every
       glyph stays at least 4 mm inside trim - the GT archive lesson. -->
  <rect x="-0.95" y="-0.95" width="2.6" height="55.88" fill="#e0a184"/>

  <text x="8" y="17.4" font-family="Menlo, monospace" font-size="7.4" fill="#eceae6" letter-spacing="0.15">KUNAI</text>
  <text x="8" y="26.2" font-family="Menlo, monospace" font-size="7.4" font-weight="700" fill="#e0a184" letter-spacing="0.1">360</text>

  <line x1="8" y1="30.6" x2="44" y2="30.6" stroke="rgba(143,163,176,0.22)" stroke-width="0.35"/>

  <text x="8" y="35.6" font-family="Menlo, monospace" font-size="2.5" fill="rgba(236,234,230,0.6)">A printable housing for the</text>
  <text x="8" y="39.6" font-family="Menlo, monospace" font-size="2.5" fill="rgba(236,234,230,0.6)">Insta360 ONE X, from code.</text>

  <text x="8" y="49.2" font-family="Menlo, monospace" font-size="2.2" font-weight="700" fill="#e0a184" letter-spacing="0.35">TWO HALVES · WATERTIGHT · FROM CONSTANTS</text>

