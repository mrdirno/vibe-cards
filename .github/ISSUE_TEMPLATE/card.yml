name: Card — show what you made
description: A card you printed. Good ones become templates in the builder.
title: "[card] "
labels: ["card"]
body:
  - type: markdown
    attributes:
      value: |
        Cards are the useful contribution here. Every real one shows something the
        templates do not handle yet — a layout, a stock, a printer, a reader — and
        that is what makes the builder better.

        A card that works ships as a template, and the credit stays on it.
  - type: textarea
    id: shot
    attributes:
      label: The card
      description: Drag an image in. Both faces if you have them, and a photo of the printed one if you can — printed and on-screen are different animals.
      placeholder: Drag images here.
    validations: { required: true }
  - type: input
    id: what
    attributes:
      label: What is it for?
      placeholder: Workshop passes for a maker space — 40 of them, names from a CSV.
    validations: { required: true }
  - type: input
    id: setup
    attributes:
      label: Printer, stock, chip
      placeholder: Canon TS702a · 30 mil inkjet PVC · NTAG215
  - type: textarea
    id: fought
    attributes:
      label: What did you have to fight? (optional)
      description: The part that took three attempts. That is usually the thing worth fixing.
      placeholder: The QR would not scan until I moved it off the dark background.
  - type: dropdown
    id: template
    attributes:
      label: May we ship this as a template?
      options:
        - "Yes — and credit me in the template"
        - "Yes — no credit needed"
        - "No, just showing it"
    validations: { required: true }
  - type: markdown
    attributes:
      value: |
        **Only upload images you are happy to have public**, and please do not
        include anyone's face or name without asking them first — a template ships
        to everyone, forever.
