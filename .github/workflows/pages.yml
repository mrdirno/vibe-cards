name: Deploy web build to GitHub Pages

# The static build is the same designer as the desktop app with a different
# backend — see src/web/backend-static.js. This workflow ASSEMBLES the site
# rather than publishing a directory as-is, because the two data files the app
# boots from (profiles.json, supplies.json) are siblings of src/web/, not
# inside it. Publishing `path: src/web` gives a site that 404s both and dies on
# boot, with a completely green deploy. The assemble step is what makes the
# artifact complete, and the check after it is what proves it.

on:
  push:
    branches: [main]
    paths:
      - 'src/web/**'
      - 'src/profiles.json'
      - 'src/supplies.json'
      - 'tools/pdf_parity.mjs'
      - 'src/pdfwriter.py'      # parity test compares the JS port against it
      # The LANDING PAGE and the registry it renders. These were missing, so a
      # commit that only edited the network — adding a project, changing a
      # curator's note — was correct on disk and invisible on the web, and the
      # deploy stayed green because it never ran at all. Every landing change so
      # far reached the site by accident, riding along with a src/web/ edit in
      # the same commit.
      - 'src/site/**'
      - 'tools/build_site.py'
      # The manifest is now PUBLISHED BYTES, not just a repo file: the build
      # copies it to the site root because that is the only surface a card's chip
      # can reach. So it belongs here for exactly the reason written above — left
      # out, raising the declared level would be correct on disk and invisible on
      # the web, and the verifier that checks the two copies match would never
      # run to notice. That is the same bug this block already fixed once.
      - 'wish-it-better.json'
      # And the verifier itself: a gate that got teeth stays untested until some
      # unrelated commit happens to redeploy.
      - 'tools/verify_pages_artifact.mjs'
      - 'tools/verify_fragments.mjs'
      - '.github/workflows/pages.yml'
      # THIRD INSTANCE OF THE BUG THE BLOCK ABOVE FIXED TWICE, and it is written
      # out again because being told twice did not stop the third. Every one of
      # these is PUBLISHED BYTES now — the build copies them to the site root so
      # they are reachable from the URL a chip carries — and none of them was
      # listed here. A commit that only corrects NOTICE (which is the file that
      # WITHHOLDS a third party's artwork from this project's licence) would have
      # been right in the repo and invisible on the web, with a green deploy that
      # never ran. The four commits that shipped them reached the site by accident,
      # each riding along with a src/site/ or tools/ edit in the same commit —
      # which is verbatim what the comment above says happened last time.
      - 'LICENSE'
      - 'NOTICE'
      - 'WISH_IT_BETTER.md'
      - 'OFL.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The one eval that can prevent a physically ruined card: the JS PDF
      # composer must place ink exactly where pdfwriter.py does. It runs before
      # anything is published, so a drift in either file blocks the deploy.
      - name: PDF geometry parity (JS port vs pdfwriter.py)
        run: node tools/pdf_parity.mjs

      - name: Assemble the site
        run: |
          set -euo pipefail
          # ONE command, the same one a laptop runs. This used to be a shell block
          # here and a python script there, both describing the same artifact —
          # which meant the local verifier could never pass, because the studio it
          # looks for was only ever assembled in CI. A check that cannot pass is
          # a check nobody runs.
          python3 tools/build_site.py _site
          find _site -name '.DS_Store' -delete
          echo "assembled: $(find _site -type f | wc -l) files"

      # Both documents get checked. The landing is the one a tapped card opens, so a
      # broken reference there is the most visible failure this repo can ship.
      - name: Verify the artifact is complete and self-contained
        run: |
          node tools/verify_pages_artifact.mjs _site/studio
          node tools/verify_pages_artifact.mjs _site
          # The artifact gate proves every PATH exists; this proves every #fragment names an
          # element the target page still has. A section that leaves one page while another
          # page keeps linking to it passed the gate above with a green deploy (2026-08-23).
          node tools/verify_fragments.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
