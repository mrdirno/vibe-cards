name: Deploy web build to GitHub Pages

# The static build is the same designer as the desktop app with a different
# backend — see src/web/backend-static.js. This workflow ASSEMBLES the site
# rather than publishing a directory as-is, because the two data files the app
# boots from (profiles.json, supplies.json) are siblings of src/web/, not
# inside it. Publishing `path: src/web` gives a site that 404s both and dies on
# boot, with a completely green deploy. The assemble step is what makes the
# artifact complete, and the check after it is what proves it.

on:
  push:
    branches: [main]
    paths:
      - 'src/web/**'
      - 'src/profiles.json'
      - 'src/supplies.json'
      - 'tools/pdf_parity.mjs'
      - 'src/pdfwriter.py'      # parity test compares the JS port against it
      # The LANDING PAGE and the registry it renders. These were missing, so a
      # commit that only edited the network — adding a project, changing a
      # curator's note — was correct on disk and invisible on the web, and the
      # deploy stayed green because it never ran at all. Every landing change so
      # far reached the site by accident, riding along with a src/web/ edit in
      # the same commit.
      - 'src/site/**'
      - 'tools/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The one eval that can prevent a physically ruined card: the JS PDF
      # composer must place ink exactly where pdfwriter.py does. It runs before
      # anything is published, so a drift in either file blocks the deploy.
      - name: PDF geometry parity (JS port vs pdfwriter.py)
        run: node tools/pdf_parity.mjs

      - name: Assemble the site
        run: |
          set -euo pipefail
          # ONE command, the same one a laptop runs. This used to be a shell block
          # here and a python script there, both describing the same artifact —
          # which meant the local verifier could never pass, because the studio it
          # looks for was only ever assembled in CI. A check that cannot pass is
          # a check nobody runs.
          python3 tools/build_site.py _site
          find _site -name '.DS_Store' -delete
          echo "assembled: $(find _site -type f | wc -l) files"

      # Both documents get checked. The landing is the one a tapped card opens, so a
      # broken reference there is the most visible failure this repo can ship.
      - name: Verify the artifact is complete and self-contained
        run: |
          node tools/verify_pages_artifact.mjs _site/studio
          node tools/verify_pages_artifact.mjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
